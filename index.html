<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>けいさん れんしゅう</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --text: #333;
    --plus: #ff7b7b;
    --minus: #4dabf7;
    --times: #51cf66;
    --divide: #fcc419;
    --main: #ff922b;
    --ok: #2fb344;
    --ng: #f03e3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    font-size: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    font-size: 32px;
    margin: 12px 0 20px;
    color: var(--main);
  }
  h2 { font-size: 22px; margin: 18px 0 10px; }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }

  button {
    font-family: inherit;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform .08s, box-shadow .08s, opacity .2s;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  /* おせる はんい を まわり に すこし ひろげる（おした とき したに うごいても はずれない） */
  button::before { content: ""; position: absolute; inset: -6px; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }

  .choice {
    font-size: 24px;
    padding: 18px 8px;
    opacity: .45;
  }
  .choice .mark { display: block; font-size: 44px; line-height: 1.1; }
  .choice.selected { opacity: 1; outline: 5px solid #333; outline-offset: -5px; }
  .c-plus { background: var(--plus); }
  .c-minus { background: var(--minus); }
  .c-times { background: var(--times); }
  .c-divide { background: var(--divide); color: #5c3d00; }
  .c-level { background: #9775fa; padding: 10px 6px; }
  .c-level2 { background: #e64980; }
  .c-level .stars { display: block; font-size: 18px; line-height: 1.4; }
  .c-level small { display: block; font-size: 18px; }

  .big-btn {
    width: 100%;
    font-size: 30px;
    padding: 20px;
    margin-top: 28px;
    background: var(--main);
  }

  /* もんだい がめん */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
  }
  .progress {
    height: 14px;
    background: #ffe3bf;
    border-radius: 7px;
    overflow: hidden;
    margin: 8px 0 10px;
  }
  .progress > div { height: 100%; width: 0; background: var(--main); transition: width .3s; }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 10px 12px 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    text-align: center;
  }
  .question {
    font-size: 46px;
    font-weight: bold;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .answer-box {
    margin-top: 6px;
    font-size: 36px;
    font-weight: bold;
    min-height: 54px;
    border: 4px dashed #ffc078;
    border-radius: 16px;
    padding: 0 4px;
    color: #333;
  }
  .answer-box.empty { color: #ccc; }
  .result {
    min-height: 52px;
    font-size: 24px;
    font-weight: bold;
    margin-top: 2px;
  }
  .result.ok { color: var(--ok); }
  .result.ng { color: var(--ng); }
  .result small { display: block; font-size: 24px; line-height: 1.2; color: var(--text); }
  .result small b { font-size: 40px; color: var(--ng); margin-left: 4px; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .keypad button {
    font-size: 32px;
    line-height: 1;
    padding: 0;
    height: 56px;
    background: #fff;
    color: #333;
    box-shadow: 0 5px 0 #e0c9a6;
    border: 3px solid #ffd8a8;
  }
  .keypad .k-del { background: #ffe3e3; border-color: #ffc9c9; font-size: 18px; line-height: 1.2; }
  .keypad button.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #e0c9a6; background: #fff3bf; }
  .action {
    width: 100%;
    font-size: 26px;
    padding: 12px;
    margin-top: 12px;
    background: var(--ok);
  }
  .action.next { background: var(--minus); }
  button:disabled { opacity: .4; }

  /* けっか がめん */
  .score {
    font-size: 72px;
    font-weight: bold;
    color: var(--main);
    margin: 4px 0;
  }
  .score small { font-size: 32px; }
  .time { font-size: 24px; font-weight: bold; }
  .nowrap { white-space: nowrap; }
  .praise { font-size: 28px; margin: 8px 0 4px; }
  .review { list-style: none; padding: 0; margin: 16px 0 0; text-align: left; }
  .review li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 2px dotted #eee;
    font-size: 22px;
  }
  .review .ok { color: var(--ok); font-weight: bold; }
  .review .ng { color: var(--ng); font-weight: bold; }
  .review .fix { font-size: 18px; color: #666; }

  .quit {
    background: none;
    color: #888;
    box-shadow: none;
    font-size: 18px;
    padding: 4px 8px;
    text-decoration: underline;
  }

  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s ease-out; }

  /* カレンダー */
  .calendar {
    margin-top: 28px;
    background: var(--card);
    border-radius: 24px;
    padding: 12px 12px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    --cell: 42px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 22px; font-weight: bold; }
  .cal-nav { width: 52px; height: 40px; padding: 0; font-size: 18px; border-radius: 14px; background: var(--main); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal-week { margin-bottom: 3px; }
  .cal-week span { font-size: 14px; font-weight: bold; color: #888; }
  .cal-week .sun, .cal-day.sun .cal-num { color: #e03131; }
  .cal-week .sat, .cal-day.sat .cal-num { color: #1c7ed6; }
  .cal-day {
    position: relative;
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .cal-day.future .cal-num { opacity: .4; }
  .cal-day.today { background: #ffe8cc; box-shadow: inset 0 0 0 3px var(--main); }
  .cal-day.today .cal-num { color: #d9480f; font-size: 20px; }
  .cal-day.picked { box-shadow: inset 0 0 0 2px #adb5bd; }
  .cal-day.today.picked { box-shadow: inset 0 0 0 3px var(--main); }
  .cal-num { position: relative; z-index: 1; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
  .cal-mark { position: absolute; inset: 1px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .cal-mark svg { height: 100%; width: 100%; }
  .cal-info { margin-top: 8px; min-height: 1.4em; font-size: 18px; font-weight: bold; text-align: center; color: #d9480f; }
  .cal-legend { margin-top: 4px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 14px; color: #777; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .cal-legend svg { width: 22px; height: 22px; }

  @media (max-width: 380px) {
    .question { font-size: 42px; }
    .choice { font-size: 20px; }
  }
  .home-btn { background: #9775fa; margin-top: 14px; font-size: 24px; }

  /* パソコン など ひろい がめん：1がめん に おさまる ように すこし コンパクト に */
  @media (min-width: 600px) {
    .wrap { max-width: 640px; padding: 8px 16px; }
    h1 { font-size: 28px; margin: 8px 0 16px; }
    h2 { font-size: 20px; margin: 18px 0 10px; }
    .grid { gap: 14px; }

    /* はじめ がめん：けいさん の しゅるい を 4つ ならべる */
    #opChoices { grid-template-columns: repeat(4, 1fr); }
    #levelChoices { grid-template-columns: repeat(4, 1fr); }
    .choice { font-size: 20px; padding: 14px 6px; }
    .choice .mark { font-size: 36px; }
    .big-btn { font-size: 26px; padding: 14px; margin-top: 26px; }

    /* もんだい がめん */
    .progress { margin: 6px 0 8px; }
    .card { padding: 8px 14px; }
    .question { font-size: 42px; }
    .answer-box { font-size: 34px; min-height: 52px; }
    .result { min-height: 54px; font-size: 22px; margin-top: 4px; }
    .result small { display: inline-block; margin-left: 16px; font-size: 22px; }
    .result small b { font-size: 36px; }
    .keypad { gap: 8px; margin-top: 12px; }
    .keypad button { height: 48px; font-size: 30px; }
    .keypad .k-del { font-size: 16px; }
    .action { font-size: 24px; padding: 10px; margin-top: 14px; }

    /* けっか がめん：ふりかえり を 2れつ、ボタン を よこ に ならべる */
    #finish .card { padding: 16px 20px; }
    .praise { font-size: 24px; margin: 4px 0 4px; }
    .score { font-size: 56px; margin: 0; line-height: 1.2; }
    .score small { font-size: 26px; }
    .time { font-size: 20px; }
    .review { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; margin-top: 14px; }
    .review li { font-size: 19px; padding: 7px 4px; }
    .review .fix { font-size: 15px; }
    .finish-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .finish-btns .big-btn { margin-top: 18px; font-size: 24px; }
  }

  /* ひろい パソコン：はじめ の がめん は、ひだり に えらぶ ところ、みぎ に カレンダー */
  @media (min-width: 860px) {
    body.on-start .wrap { max-width: 1080px; }
    .start-layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; align-items: start; }
    .calendar { margin-top: 10px; --cell: 40px; }
  }
  @media (min-width: 860px) and (min-height: 700px) {
    .calendar { margin-top: 16px; padding: 14px 16px 12px; --cell: 46px; }
  }
  @media (min-width: 860px) and (min-height: 800px) {
    .calendar { margin-top: 22px; --cell: 52px; }
    .cal-day { font-size: 20px; }
  }
  @media (min-width: 860px) and (min-height: 900px) {
    .calendar { margin-top: 30px; padding: 18px 18px 14px; --cell: 58px; }
    .cal-grid { gap: 4px; }
  }

  /* たて に よゆう が ある パソコン では、もう すこし ゆったり */
  @media (min-width: 600px) and (min-height: 700px) {
    .wrap { padding: 16px 16px; }
    h1 { margin: 12px 0 20px; }
    h2 { margin: 22px 0 12px; }
    .grid { gap: 16px; }
    .choice { padding: 16px 6px; }
    .big-btn { padding: 16px; margin-top: 30px; }

    .progress { margin: 10px 0 14px; }
    .card { padding: 16px 18px; }
    .answer-box { margin-top: 10px; }
    .result { margin-top: 8px; }
    .result { font-size: 26px; }
    .result small { font-size: 26px; }
    .result small b { font-size: 46px; }
    .keypad { gap: 10px; margin-top: 16px; }
    .keypad button { height: 54px; }
    .action { padding: 12px; margin-top: 16px; }

    #finish .card { padding: 20px 24px; }
    .review { margin-top: 16px; }
    .review li { padding: 9px 4px; }
    .finish-btns .big-btn { margin-top: 22px; }
  }

  /* たて が もっと ひろい パソコン では、さらに ゆったり */
  @media (min-width: 600px) and (min-height: 800px) {
    .wrap { padding: 24px 16px; }
    h1 { font-size: 30px; margin: 16px 0 28px; }
    h2 { margin: 28px 0 14px; }
    .grid { gap: 18px; }
    .choice { padding: 22px 6px; }
    .choice .mark { font-size: 40px; }
    .big-btn { padding: 18px; margin-top: 36px; }

    .progress { margin: 14px 0 18px; }
    .card { padding: 22px 20px; }
    .question { font-size: 46px; }
    .answer-box { margin-top: 14px; min-height: 60px; }
    .result { min-height: 60px; margin-top: 10px; }
    .keypad { gap: 12px; margin-top: 20px; }
    .keypad button { height: 62px; font-size: 32px; }
    .action { padding: 14px; margin-top: 20px; }

    #finish .card { padding: 24px 28px; }
    .praise { margin: 6px 0 8px; }
    .score { font-size: 60px; }
    .review { margin-top: 20px; }
    .review li { padding: 12px 4px; }
    .finish-btns .big-btn { margin-top: 28px; }
  }

  @media (min-width: 600px) and (min-height: 900px) {
    .wrap { padding: 32px 16px; }
    h1 { margin: 20px 0 36px; }
    h2 { margin: 36px 0 16px; }
    .grid { gap: 20px; }
    .choice { padding: 28px 6px; }
    .big-btn { padding: 20px; margin-top: 44px; }

    .progress { margin: 16px 0 24px; }
    .card { padding: 28px 22px; }
    .answer-box { margin-top: 18px; }
    .result { margin-top: 14px; }
    .keypad { gap: 14px; margin-top: 26px; }
    .keypad button { height: 68px; font-size: 34px; }
    .action { padding: 16px; margin-top: 26px; }

    #finish .card { padding: 30px 32px; }
    .praise { margin: 8px 0 12px; }
    .review { margin-top: 24px; }
    .review li { padding: 14px 4px; }
    .finish-btns .big-btn { margin-top: 34px; }
  }
</style>
</head>
<body class="on-start">
<div class="wrap">

  <!-- はじめ がめん -->
  <section id="start" class="screen active">
    <h1>🧮 けいさん れんしゅう</h1>

    <div class="start-layout">
    <div class="start-main">
    <h2>① どの けいさん を する？</h2>
    <div class="grid grid-2" id="opChoices">
      <button class="choice c-plus selected" data-op="+"><span class="mark">＋</span>たしざん</button>
      <button class="choice c-minus" data-op="-"><span class="mark">－</span>ひきざん</button>
      <button class="choice c-times" data-op="×"><span class="mark">×</span>かけざん</button>
      <button class="choice c-divide" data-op="÷"><span class="mark">÷</span>わりざん</button>
    </div>

    <h2>② むずかしさ は？</h2>
    <div class="grid grid-2" id="levelChoices">
      <button class="choice c-level selected" data-level="1e"><span class="stars">⭐</span>1けた<small>やさしい</small></button>
      <button class="choice c-level" data-level="1h"><span class="stars">⭐⭐</span>1けた<small>むずかしい</small></button>
      <button class="choice c-level c-level2" data-level="2e"><span class="stars">⭐⭐⭐</span>2けた<small>やさしい</small></button>
      <button class="choice c-level c-level2" data-level="2h"><span class="stars">⭐⭐⭐⭐</span>2けた<small>むずかしい</small></button>
    </div>

    <button class="big-btn" id="startBtn">スタート！</button>
    </div>

    <!-- カレンダー -->
    <div class="calendar">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev" aria-label="まえ の つき">◀</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="cal-nav" id="calNext" aria-label="つぎ の つき">▶</button>
      </div>
      <div class="cal-grid cal-week">
        <span class="sun">にち</span><span>げつ</span><span>か</span><span>すい</span><span>もく</span><span>きん</span><span class="sat">ど</span>
      </div>
      <div class="cal-grid" id="calDays"></div>
      <div class="cal-info" id="calInfo"></div>
      <div class="cal-legend" id="calLegend"></div>
    </div>
    </div>
  </section>

  <!-- もんだい がめん -->
  <section id="quiz" class="screen">
    <div class="topbar">
      <span id="qNum">1もんめ / 10</span>
      <span id="timer">⏱ 0びょう</span>
      <button class="quit" id="quitBtn">やめる</button>
    </div>
    <div class="progress"><div id="bar"></div></div>

    <div class="card">
      <div class="question" id="question"></div>
      <div class="answer-box empty" id="answerBox">？</div>
      <div class="result" id="result"></div>
    </div>

    <div class="keypad" id="keypad">
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="clear" class="k-del">ぜんぶ<br>けす</button>
      <button data-key="0">0</button>
      <button data-key="back" class="k-del">1つ<br>けす</button>
    </div>

    <button class="action" id="checkBtn" disabled>こたえあわせ</button>
  </section>

  <!-- けっか がめん -->
  <section id="finish" class="screen">
    <h1>🎉 おつかれさま！</h1>
    <div class="card">
      <div class="praise" id="praise"></div>
      <div class="score" id="score"></div>
      <div class="time" id="timeResult"></div>
      <ul class="review" id="review"></ul>
    </div>
    <div class="finish-btns">
      <button class="big-btn" id="retryBtn">もういちど</button>
      <button class="big-btn home-btn" id="homeBtn">さいしょに もどる</button>
    </div>
  </section>

</div>

<script>
(() => {
  const TOTAL = 10;
  const MAX_DIGITS = 4;
  const AUTO_NEXT_OK_MS = 1500; // せいかい の とき
  const AUTO_NEXT_NG_MS = 3000; // まちがい の とき（こたえ を みる じかん）

  let op = "+";
  let level = "1e";
  let problems = [];
  let index = 0;
  let input = "";
  let answered = false;
  let startTime = 0;
  let timerId = null;
  let autoNextId = null;

  const $ = (id) => document.getElementById(id);

  // ---- えらぶ ボタン ----
  function setupChoices(containerId, onPick) {
    const buttons = $(containerId).querySelectorAll(".choice");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        onPick(btn.dataset);
      });
    });
  }
  setupChoices("opChoices", (d) => { op = d.op; });
  setupChoices("levelChoices", (d) => { level = d.level; });

  // ---- もんだい を つくる ----
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  // じょうけん に あう もんだい が でる まで つくりなおす
  function pick(make, ok) {
    for (;;) { const v = make(); if (ok(v)) return v; }
  }
  const ones = (n) => n % 10;
  const tens = (n) => Math.floor(n / 10);

  // むずかしさ
  //   1e: 1けた やさしい   1h: 1けた むずかしい
  //   2e: 2けた やさしい   2h: 2けた むずかしい
  function makeProblem() {
    let a, b, ans;
    switch (op) {
      case "+":
        [a, b] = pick(
          () => level[0] === "1" ? [rand(1, 9), rand(1, 9)] : [rand(10, 99), rand(10, 99)],
          ([x, y]) => {
            const carry = ones(x) + ones(y) >= 10 || (level[0] === "1" && x + y >= 10);
            if (level === "1e") return x + y <= 9;            // くりあがり なし
            if (level === "1h") return x + y >= 10;           // くりあがり あり
            if (level === "2e") return !carry && x + y <= 99; // くりあがり なし
            return carry;                                     // くりあがり あり
          });
        ans = a + b;
        break;
      case "-":
        // こたえ が マイナス に ならない ように する
        [a, b] = pick(
          () => level === "1e" ? [rand(2, 9), rand(1, 8)]
              : level === "1h" ? [rand(11, 18), rand(2, 9)]
              : [rand(20, 99), rand(10, 98)],
          ([x, y]) => {
            if (x <= y) return false;
            if (level === "1e") return true;                  // 9 までの ひきざん
            if (level === "1h") return ones(x) < y;           // くりさがり あり
            if (level === "2e") return ones(x) >= ones(y);    // くりさがり なし
            return ones(x) < ones(y);                         // くりさがり あり
          });
        ans = a - b;
        break;
      case "×":
        [a, b] = pick(
          () => level[0] === "1" ? [rand(1, 9), rand(1, 9)] : [rand(11, 99), rand(2, 9)],
          ([x, y]) => {
            if (level === "1e") return x <= 5;                // 1〜5 の だん
            if (level === "1h") return x >= 6;                // 6〜9 の だん
            const easy = tens(x) * y < 10 && ones(x) * y < 10;
            return level === "2e" ? easy : !easy;             // くりあがり なし / あり
          });
        ans = a * b;
        break;
      case "÷":
        // かならず わりきれる もんだい
        [b, ans] = pick(
          () => level[0] === "1" ? [rand(1, 9), rand(1, 9)] : [rand(2, 9), rand(10, 49)],
          ([y, q]) => {
            if (level === "1e") return y <= 5;                // 1〜5 の だん の ぎゃく
            if (level === "1h") return y >= 6;                // 6〜9 の だん の ぎゃく
            if (y * q > 99) return false;                     // わられる かず は 2けた
            const easy = tens(q) * y < 10 && ones(q) * y < 10;
            return level === "2e" ? easy : !easy;             // 84÷4 の ような かんたん な もの / 72÷4 の ような もの
          });
        a = b * ans;
        break;
    }
    return { a, b, ans, text: `${a} ${op} ${b}` };
  }

  function makeProblems() {
    const list = [];
    const seen = new Set();
    let tries = 0;
    while (list.length < TOTAL) {
      const p = makeProblem();
      if (!seen.has(p.text) || tries++ > 200) {
        seen.add(p.text);
        list.push(p);
      }
    }
    return list;
  }

  // ---- きろく（ブラウザ に ほぞん して、とじても きえない）----
  const RECORD_KEY = "keisan-renshu-records";
  const MARU_COUNT = 10;     // この かず いじょう で ○
  const HANAMARU_COUNT = 20; // この かず いじょう で はなまる

  function loadRecords() {
    try {
      const data = JSON.parse(localStorage.getItem(RECORD_KEY));
      return data && typeof data === "object" && !Array.isArray(data) ? data : {};
    } catch (e) {
      return {};
    }
  }
  let records = loadRecords();

  const pad2 = (n) => String(n).padStart(2, "0");
  const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const countOf = (key) => Number(records[key]) || 0;

  // こたえあわせ を する たび に、その日 の かず を 1 ふやす
  function addRecord() {
    records = loadRecords(); // べつ の タブ で ふえた ぶん も いかす
    const key = dateKey(new Date());
    records[key] = countOf(key) + 1;
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (e) { /* ほぞん できなくても つづける */ }
  }

  // ---- カレンダー ----
  const MARU_SVG =
    '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="41" fill="none" stroke="#f03e3e" stroke-width="7"/></svg>';
  const HANAMARU_SVG = (() => {
    // まわり の はなびら
    const N = 10, R = 38, r = 12;
    const pt = (i) => {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      return `${(50 + R * Math.cos(a)).toFixed(1)} ${(50 + R * Math.sin(a)).toFixed(1)}`;
    };
    let petals = `M${pt(0)}`;
    for (let i = 1; i <= N; i++) petals += ` A${r} ${r} 0 0 1 ${pt(i)}`;
    // なか の ぐるぐる（まんなか の すうじ に かからない ように そと がわ だけ）
    let spiral = "";
    for (let i = 0; i <= 80; i++) {
      const t = i / 80;
      const a = -Math.PI / 2 + t * Math.PI * 2 * 1.75;
      const rr = 31 - t * 9;
      spiral += `${i ? " L" : "M"}${(50 + rr * Math.cos(a)).toFixed(1)} ${(50 + rr * Math.sin(a)).toFixed(1)}`;
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#f03e3e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' +
      `<path d="${petals}" fill="#fff0f6"/><path d="${spiral}" fill="none"/></g></svg>`;
  })();
  const markOf = (n) => n >= HANAMARU_COUNT ? HANAMARU_SVG : n >= MARU_COUNT ? MARU_SVG : "";

  let calYear, calMonth, calPicked = null;

  function resetCalendar() {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    calPicked = null;
    renderCalendar();
  }

  function renderCalendar() {
    const todayKey = dateKey(new Date());
    $("calTitle").textContent = `${calYear}ねん ${calMonth + 1}がつ`;
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    let html = "";
    for (let i = 0; i < first; i++) html += "<div></div>";
    for (let d = 1; d <= days; d++) {
      const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
      const wd = (first + d - 1) % 7;
      const cls = ["cal-day",
        wd === 0 ? "sun" : wd === 6 ? "sat" : "",
        key === todayKey ? "today" : "",
        key > todayKey ? "future" : "",
        key === calPicked ? "picked" : ""].join(" ");
      html += `<div class="${cls}" data-date="${key}">` +
        `<span class="cal-mark">${markOf(countOf(key))}</span><span class="cal-num">${d}</span></div>`;
    }
    $("calDays").innerHTML = html;
    renderCalInfo();
  }

  function renderCalInfo() {
    const todayKey = dateKey(new Date());
    const key = calPicked || todayKey;
    const n = countOf(key);
    let text;
    if (key === todayKey) {
      text = n >= HANAMARU_COUNT ? `きょう は ${n}もん！ はなまる 🎉`
           : n >= MARU_COUNT ? `きょう は ${n}もん！ あと ${HANAMARU_COUNT - n}もん で はなまる`
           : `きょう は ${n}もん。あと ${MARU_COUNT - n}もん で ○`;
    } else {
      const [, m, d] = key.split("-").map(Number);
      text = key > todayKey ? `${m}がつ ${d}にち は まだ だよ`
           : `${m}がつ ${d}にち は ${n}もん` + (n >= HANAMARU_COUNT ? " はなまる" : n >= MARU_COUNT ? " ○" : "");
    }
    $("calInfo").textContent = text;
  }

  $("calLegend").innerHTML =
    `<span>${MARU_SVG} ${MARU_COUNT}もん いじょう</span><span>${HANAMARU_SVG} ${HANAMARU_COUNT}もん いじょう</span>`;
  $("calPrev").addEventListener("click", () => {
    if (--calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  $("calNext").addEventListener("click", () => {
    if (++calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
  $("calDays").addEventListener("click", (e) => {
    const day = e.target.closest(".cal-day");
    if (!day) return;
    calPicked = calPicked === day.dataset.date ? null : day.dataset.date;
    renderCalendar();
  });
  resetCalendar();

  // ---- がめん きりかえ ----
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
    document.body.classList.toggle("on-start", id === "start");
    if (id === "start") resetCalendar();
    window.scrollTo(0, 0);
  }

  // ---- こうかおん（おんせい ファイル は つかわず ブラウザ で つくる）----
  let audioCtx = null;
  // スマホ は さいしょ に がめん を さわった とき で ないと おと が でない ので、そこで じゅんび する
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { /* おと が だせなくても つづける */ }
  }
  document.addEventListener("pointerdown", unlockAudio);
  document.addEventListener("keydown", unlockAudio);

  function tone(freq, start, dur, type = "sine", vol = 0.35) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  }
  // せいかい の「ピンポン」（たかい おと → ひくい おと）
  function playPinpon() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    tone(1319, t, 0.35);        // ピン（ミ）
    tone(1047, t + 0.18, 0.6);  // ポン（ド）
  }
  // まちがい の「ブブー」（ひくい ブザー の おと）
  function playBubu() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    tone(150, t, 0.16, "square", 0.12);        // ブ
    tone(150, t + 0.22, 0.6, "square", 0.12);  // ブー
  }

  // ---- タイマー ----
  function formatTime(ms) {
    const sec = Math.floor(ms / 1000);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m > 0 ? `${m}ぷん ${s}びょう` : `${s}びょう`;
  }
  function startTimer() {
    startTime = Date.now();
    $("timer").textContent = "⏱ 0びょう";
    clearInterval(timerId);
    timerId = setInterval(() => {
      $("timer").textContent = "⏱ " + formatTime(Date.now() - startTime);
    }, 250);
  }
  function stopTimer() {
    clearInterval(timerId);
    clearTimeout(autoNextId);
    return Date.now() - startTime;
  }

  // ---- ゲーム の ながれ ----
  function startGame() {
    problems = makeProblems();
    index = 0;
    show("quiz");
    showProblem();
    startTimer();
  }

  function showProblem() {
    const p = problems[index];
    input = "";
    answered = false;
    $("qNum").textContent = `${index + 1}もんめ / ${TOTAL}`;
    $("bar").style.width = `${(index / TOTAL) * 100}%`;
    $("question").textContent = `${p.text} ＝`;
    $("result").textContent = "";
    $("result").className = "result";
    $("checkBtn").textContent = "こたえあわせ";
    $("checkBtn").className = "action";
    setKeypadEnabled(true);
    renderInput();
  }

  function renderInput() {
    const box = $("answerBox");
    if (input === "") {
      box.textContent = "？";
      box.classList.add("empty");
    } else {
      box.textContent = input;
      box.classList.remove("empty");
    }
    $("checkBtn").disabled = !answered && input === "";
  }

  function setKeypadEnabled(on) {
    $("keypad").querySelectorAll("button").forEach((b) => (b.disabled = !on));
  }

  function pressKey(key) {
    if (answered) return;
    if (key === "back") input = input.slice(0, -1);
    else if (key === "clear") input = "";
    else if (input.length < MAX_DIGITS) input = input === "0" ? key : input + key;
    renderInput();
  }

  function check() {
    if (answered || input === "") return;
    const p = problems[index];
    p.user = Number(input);
    p.correct = p.user === p.ans;
    answered = true;
    addRecord();
    setKeypadEnabled(false);

    const r = $("result");
    if (p.correct) {
      r.innerHTML = "⭕ せいかい！";
      r.className = "result ok pop";
      playPinpon();
    } else {
      r.innerHTML = `❌ ざんねん…<small>こたえ は <b>${p.ans}</b></small>`;
      r.className = "result ng pop";
      playBubu();
    }
    $("bar").style.width = `${((index + 1) / TOTAL) * 100}%`;
    // せいかい は 1.5びょう、まちがい は 3びょう で じどう で つぎ へ すすむ
    const btn = $("checkBtn");
    btn.textContent = index + 1 < TOTAL ? "つぎ に すすむよ…" : "けっか を だすよ…";
    btn.className = "action next";
    btn.disabled = true;
    autoNextId = setTimeout(next, p.correct ? AUTO_NEXT_OK_MS : AUTO_NEXT_NG_MS);
  }

  function next() {
    index++;
    if (index < TOTAL) showProblem();
    else finish();
  }

  function finish() {
    const elapsed = stopTimer();
    const score = problems.filter((p) => p.correct).length;
    $("score").innerHTML = `${score}<small> / ${TOTAL} もん</small>`;
    $("timeResult").innerHTML = `かかった じかん：<span class="nowrap">${formatTime(elapsed)}</span>`;
    $("praise").textContent =
      score === TOTAL ? "💯 ぜんもん せいかい！すごい！" :
      score >= 8 ? "🌟 よく できました！" :
      score >= 5 ? "👍 がんばったね！" :
                   "💪 つぎ も がんばろう！";

    $("review").innerHTML = problems.map((p) => `
      <li>
        <span>${p.text} ＝ ${p.user}</span>
        ${p.correct
          ? '<span class="ok">⭕</span>'
          : `<span class="ng">❌ <span class="fix">こたえ ${p.ans}</span></span>`}
      </li>`).join("");
    show("finish");
  }

  // ---- イベント ----
  $("startBtn").addEventListener("click", startGame);
  $("retryBtn").addEventListener("click", startGame);
  $("homeBtn").addEventListener("click", () => show("start"));
  $("quitBtn").addEventListener("click", () => {
    if (confirm("とちゅう で やめる？")) { stopTimer(); show("start"); }
  });
  $("checkBtn").addEventListener("click", check);
  // すうじ ボタン は「おした しゅんかん」に はんのう する。
  // ボタン と ボタン の すきま を おした とき は、いちばん ちかい ボタン と して あつかう。
  function nearestKey(x, y) {
    let best = null, bestDist = Infinity;
    $("keypad").querySelectorAll("button").forEach((b) => {
      const r = b.getBoundingClientRect();
      const dx = Math.max(r.left - x, 0, x - r.right);
      const dy = Math.max(r.top - y, 0, y - r.bottom);
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = b; }
    });
    return best;
  }
  function flash(btn) {
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 120);
  }
  $("keypad").addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); // もじ の せんたく や ダブルタップ で の かくだい を ふせぐ
    const btn = nearestKey(e.clientX, e.clientY);
    if (!btn || btn.disabled) return;
    flash(btn);
    pressKey(btn.dataset.key);
  });
  // Tab キー で えらんで Enter / スペース で おした とき
  $("keypad").addEventListener("click", (e) => {
    if (e.detail !== 0) return; // マウス・タッチ は pointerdown で しょり ずみ
    const btn = e.target.closest("button");
    if (btn && !btn.disabled) pressKey(btn.dataset.key);
  });

  // パソコン の キーボード でも つかえる
  document.addEventListener("keydown", (e) => {
    if (!$("quiz").classList.contains("active")) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); pressKey("back"); }
    else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.closest("#keypad")) return; // Tab で えらんだ すうじ ボタン を おす
      e.preventDefault(); check();
    }
  });
})();
</script>
</body>
</html>
