<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>けいさん れんしゅう</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --text: #333;
    --plus: #ff7b7b;
    --minus: #4dabf7;
    --times: #51cf66;
    --divide: #fcc419;
    --main: #ff922b;
    --ok: #2fb344;
    --ng: #f03e3e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    font-size: 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  h1 {
    text-align: center;
    font-size: 32px;
    margin: 12px 0 20px;
    color: var(--main);
  }
  h2 { font-size: 22px; margin: 18px 0 10px; }
  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  .grid { display: grid; gap: 12px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }

  button {
    font-family: inherit;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform .08s, box-shadow .08s, opacity .2s;
    position: relative;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  /* おせる はんい を まわり に すこし ひろげる（おした とき したに うごいても はずれない） */
  button::before { content: ""; position: absolute; inset: -6px; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }

  .choice {
    font-size: 24px;
    padding: 18px 8px;
    opacity: .45;
  }
  .choice .mark { display: block; font-size: 44px; line-height: 1.1; }
  .choice.selected { opacity: 1; outline: 5px solid #333; outline-offset: -5px; }
  .c-plus { background: var(--plus); }
  .c-minus { background: var(--minus); }
  .c-times { background: var(--times); }
  .c-divide { background: var(--divide); color: #5c3d00; }
  .c-level { background: #9775fa; padding: 10px 6px; }
  .c-level2 { background: #e64980; }
  .c-level .stars { display: block; font-size: 18px; line-height: 1.4; }
  .c-level small { display: block; font-size: 18px; }

  .big-btn {
    width: 100%;
    font-size: 30px;
    padding: 20px;
    margin-top: 28px;
    background: var(--main);
  }

  /* もんだい がめん */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
  }
  .progress {
    height: 14px;
    background: #ffe3bf;
    border-radius: 7px;
    overflow: hidden;
    margin: 8px 0 10px;
  }
  .progress > div { height: 100%; width: 0; background: var(--main); transition: width .3s; }

  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 10px 12px 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    text-align: center;
  }
  .question {
    font-size: 46px;
    font-weight: bold;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .answer-box {
    margin-top: 6px;
    font-size: 36px;
    font-weight: bold;
    min-height: 54px;
    border: 4px dashed #ffc078;
    border-radius: 16px;
    padding: 0 4px;
    color: #333;
  }
  .answer-box.empty { color: #ccc; }
  .result {
    min-height: 52px;
    font-size: 24px;
    font-weight: bold;
    margin-top: 2px;
  }
  .result.ok { color: var(--ok); }
  .result.ng { color: var(--ng); }
  .result small { display: block; font-size: 24px; line-height: 1.2; color: var(--text); }
  .result small b { font-size: 40px; color: var(--ng); margin-left: 4px; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .keypad button {
    font-size: 32px;
    line-height: 1;
    padding: 0;
    height: 56px;
    background: #fff;
    color: #333;
    box-shadow: 0 5px 0 #e0c9a6;
    border: 3px solid #ffd8a8;
  }
  .keypad .k-del { background: #ffe3e3; border-color: #ffc9c9; font-size: 18px; line-height: 1.2; }
  .keypad button.pressed { transform: translateY(4px); box-shadow: 0 1px 0 #e0c9a6; background: #fff3bf; }
  .action {
    width: 100%;
    font-size: 26px;
    padding: 12px;
    margin-top: 12px;
    background: var(--ok);
  }
  .action.next { background: var(--minus); }
  button:disabled { opacity: .4; }

  /* けっか がめん */
  .score {
    font-size: 72px;
    font-weight: bold;
    color: var(--main);
    margin: 4px 0;
  }
  .score small { font-size: 32px; }
  .time { font-size: 24px; font-weight: bold; }
  .nowrap { white-space: nowrap; }
  .praise { font-size: 28px; margin: 8px 0 4px; }
  .review { list-style: none; padding: 0; margin: 16px 0 0; text-align: left; }
  .review li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 2px dotted #eee;
    font-size: 22px;
  }
  .review .ok { color: var(--ok); font-weight: bold; }
  .review .ng { color: var(--ng); font-weight: bold; }
  .review .fix { font-size: 18px; color: #666; }

  .quit {
    background: none;
    color: #888;
    box-shadow: none;
    font-size: 18px;
    padding: 4px 8px;
    text-decoration: underline;
  }

  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s ease-out; }

  /* カレンダー */
  .calendar {
    margin-top: 28px;
    background: var(--card);
    border-radius: 24px;
    padding: 12px 12px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    --cell: 42px;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 22px; font-weight: bold; }
  .cal-nav { width: 52px; height: 40px; padding: 0; font-size: 18px; border-radius: 14px; background: var(--main); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal-week { margin-bottom: 3px; }
  .cal-week span { font-size: 14px; font-weight: bold; color: #888; }
  .cal-week .sun, .cal-day.sun .cal-num { color: #e03131; }
  .cal-week .sat, .cal-day.sat .cal-num { color: #1c7ed6; }
  .cal-day {
    position: relative;
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .cal-day.future .cal-num { opacity: .4; }
  .cal-day.today { background: #ffe8cc; box-shadow: inset 0 0 0 3px var(--main); }
  .cal-day.today .cal-num { color: #d9480f; font-size: 20px; }
  .cal-day.picked { box-shadow: inset 0 0 0 2px #adb5bd; }
  .cal-day.today.picked { box-shadow: inset 0 0 0 3px var(--main); }
  .cal-num { position: relative; z-index: 1; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
  .cal-mark { position: absolute; inset: 1px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .cal-mark svg { height: 100%; width: 100%; }
  .cal-info { margin-top: 8px; min-height: 1.4em; font-size: 18px; font-weight: bold; text-align: center; color: #d9480f; }
  .cal-legend { margin-top: 4px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 14px; color: #777; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .cal-legend svg { width: 22px; height: 22px; }

  @media (max-width: 380px) {
    .question { font-size: 42px; }
    .choice { font-size: 20px; }
  }
  .home-btn { background: #9775fa; margin-top: 14px; font-size: 24px; }

  /* おうちのかたへ（ほごしゃ むけ の がくしゅう レポート） */
  .parent-link {
    align-self: center;
    margin-top: 20px;
    background: none;
    color: #888;
    box-shadow: none;
    font-size: 15px;
    font-weight: normal;
    padding: 6px 10px;
    text-decoration: underline;
  }
  .parent-link:active { transform: none; box-shadow: none; }
  #parent { font-size: 16px; line-height: 1.5; }
  #parent h1 { margin-bottom: 6px; }
  #parent h1 small { display: block; font-size: 16px; color: #888; font-weight: normal; }
  .rp-card {
    background: var(--card);
    border-radius: 18px;
    padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    margin-top: 14px;
  }
  .rp-card h3 { margin: 0 0 10px; font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .rp-note { font-size: 13px; color: #888; font-weight: normal; }
  .rp-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .rp-stat { background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .rp-stat .label { font-size: 13px; color: #777; }
  .rp-stat .val { font-size: 26px; font-weight: bold; color: #d9480f; line-height: 1.25; }
  .rp-stat .val small { font-size: 14px; color: var(--text); margin-left: 2px; }
  .rp-stat .sub { font-size: 12px; color: #888; min-height: 1.5em; }
  .rp-op {
    display: grid;
    grid-template-columns: 4.6em 1fr 3.6em 3.6em;
    align-items: center;
    column-gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dotted #ddd;
  }
  .rp-op:last-child { border-bottom: none; }
  .rp-op > span:nth-child(n+3) { text-align: right; }
  .rp-op-head { font-size: 12px; color: #888; padding: 0 0 4px; }
  .rp-op-name { font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .rp-op-name i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .rp-op-bar { display: flex; align-items: center; gap: 8px; }
  .rp-op-bar b { width: 2.8em; text-align: right; flex: none; }
  .rp-op-bar .bar { flex: 1; height: 8px; background: #f1f3f5; border-radius: 4px; overflow: hidden; }
  .rp-op-bar .bar span { display: block; height: 100%; }
  .rp-op-sub { grid-column: 1 / -1; font-size: 12px; color: #888; text-align: left !important; }
  .rp-op .up { color: var(--ok); font-weight: bold; }
  .rp-op .down { color: var(--ng); font-weight: bold; }
  .rp-op .flat { color: #888; }
  .rp-weak { list-style: none; margin: 0; padding: 0; }
  .rp-weak li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dotted #ddd; }
  .rp-weak li:last-child { border-bottom: none; }
  .rp-weak .rank {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #ffe8cc;
    color: #d9480f;
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
  }
  .rp-weak li:first-child .rank { background: var(--main); color: #fff; }
  .rp-weak-sub { font-size: 13px; color: #777; }
  .rp-empty { color: #888; }
  .rp-advice { margin: 0 0 10px; }
  .rp-advice:last-child { margin-bottom: 0; }
  .rp-advice span { display: inline-block; font-size: 12px; font-weight: bold; color: #fff; border-radius: 6px; padding: 1px 8px; margin-right: 6px; }
  .rp-advice.good span { background: var(--ok); }
  .rp-advice.next span { background: var(--minus); }
  .rp-foot { font-size: 12px; color: #888; margin: 12px 2px 0; }
  @media (min-width: 600px) {
    .rp-stats { grid-template-columns: repeat(3, 1fr); }
  }

  /* そだつ なかま（キャラクター）と けいけんち */
  .start-layout { display: flex; flex-direction: column; }
  .start-side { display: contents; } /* スマホ では キャラクター を いちばん うえ に だす */
  .buddy {
    order: -1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border-radius: 24px;
    padding: 6px 12px 6px 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    margin-bottom: 2px;
  }
  .buddy-pic { width: 64px; height: 64px; flex: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  .buddy-pic svg { display: block; width: 100%; height: 100%; transform-origin: 50% 95%; animation: bob 2.4s ease-in-out infinite; }
  .buddy-pic.jump svg { animation: jump .55s ease-out; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes jump {
    0% { transform: none; }
    30% { transform: translateY(-14px) scale(1.04, .96); }
    60% { transform: translateY(0) scale(1.08, .9); }
    100% { transform: none; }
  }
  .buddy-info { flex: 1; min-width: 0; }
  .buddy-name { font-size: 16px; font-weight: bold; word-break: keep-all; line-height: 1.35; }
  .buddy-lv { color: #fff; background: var(--main); border-radius: 8px; padding: 0 6px; font-size: 15px; margin-right: 4px; }
  .xp-bar { height: 12px; background: #ffe3bf; border-radius: 6px; overflow: hidden; margin: 5px 0 3px; }
  .xp-bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #ffd43b, var(--main)); border-radius: 6px; transition: width .6s; }
  .buddy-next { font-size: 13px; color: #888; line-height: 1.3; }
  .badge-btn {
    flex: none;
    background: #fff3bf;
    color: #8a5a00;
    box-shadow: 0 4px 0 #f0d58a;
    font-size: 26px;
    line-height: 1.1;
    padding: 6px 10px 5px;
    border-radius: 16px;
  }
  .badge-btn small { display: block; font-size: 12px; }
  .badge-btn b { display: block; font-size: 13px; }

  /* バッジ */
  .medal {
    width: 64px;
    height: 64px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    background: radial-gradient(circle at 35% 30%, #fff9db, #ffd43b 70%, #f59f00);
    box-shadow: inset 0 0 0 4px #fab005, 0 3px 0 #e8a200;
  }
  .medal.locked { background: #e9ecef; box-shadow: inset 0 0 0 4px #dee2e6; }
  .medal.locked span { filter: brightness(0); opacity: .2; } /* まだ の バッジ は シルエット */
  .badge-summary { text-align: center; font-size: 20px; font-weight: bold; color: #8a5a00; margin: -10px 0 12px; }
  .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge-card { background: var(--card); border-radius: 18px; padding: 10px 6px 8px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,0.06); }
  .badge-card.locked { background: #f8f9fa; box-shadow: none; }
  .badge-name, .badge-desc, .cele-text { word-break: keep-all; } /* ことば の とちゅう で おりかえさない */
  .badge-name { font-size: 14px; font-weight: bold; margin-top: 6px; line-height: 1.3; }
  .badge-card.locked .badge-name { color: #999; }
  .badge-desc { font-size: 11px; color: #888; line-height: 1.35; margin-top: 2px; }
  .badge-prog { font-size: 12px; color: var(--main); font-weight: bold; margin-top: 2px; }

  /* おいわい（レベルアップ・バッジ ゲット） */
  .celebrate {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(255, 248, 231, .94);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }
  .celebrate[hidden] { display: none; }
  .confetti span { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .cele-box {
    position: relative;
    width: 100%;
    max-width: 440px;
    max-height: 100%;
    overflow-y: auto;
    background: var(--card);
    border-radius: 28px;
    padding: 20px 20px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .cele-title { font-size: 34px; font-weight: bold; color: var(--main); text-shadow: 0 3px 0 #ffe066; white-space: nowrap; }
  .cele-pic { width: 180px; height: 180px; margin: 6px auto; }
  .cele-pic svg { width: 100%; height: 100%; transform-origin: 50% 95%; animation: jump .8s .35s ease-out 2; }
  .cele-text { font-size: 20px; font-weight: bold; }
  .cele-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 14px 0 4px; }
  .cele-badge { width: 120px; }
  .cele-badge .cele-text { font-size: 16px; margin-top: 6px; }
  .cele-badges.one .cele-badge { width: 100%; }
  .cele-badges.one .medal { width: 120px; height: 120px; font-size: 64px; box-shadow: inset 0 0 0 6px #fab005, 0 4px 0 #e8a200; }
  .cele-badges.one .cele-text { font-size: 24px; }
  .cele-badges.one .badge-desc { font-size: 15px; }
  .cele-box .big-btn { margin-top: 18px; }

  /* けっか がめん の けいけんち */
  .xp-gain { font-size: 22px; font-weight: bold; color: #e67700; }
  .xp-gain small { font-size: 15px; margin-left: 4px; }

  /* パソコン など ひろい がめん：1がめん に おさまる ように すこし コンパクト に */
  @media (min-width: 600px) {
    .wrap { max-width: 640px; padding: 8px 16px; }
    h1 { font-size: 28px; margin: 8px 0 16px; }
    h2 { font-size: 20px; margin: 18px 0 10px; }
    .grid { gap: 14px; }

    /* はじめ がめん：けいさん の しゅるい を 4つ ならべる */
    #opChoices { grid-template-columns: repeat(4, 1fr); }
    #levelChoices { grid-template-columns: repeat(4, 1fr); }
    .choice { font-size: 20px; padding: 14px 6px; }
    .choice .mark { font-size: 36px; }
    .big-btn { font-size: 26px; padding: 14px; margin-top: 26px; }

    /* もんだい がめん */
    .progress { margin: 6px 0 8px; }
    .card { padding: 8px 14px; }
    .question { font-size: 42px; }
    .answer-box { font-size: 34px; min-height: 52px; }
    .result { min-height: 54px; font-size: 22px; margin-top: 4px; }
    .result small { display: inline-block; margin-left: 16px; font-size: 22px; }
    .result small b { font-size: 36px; }
    .keypad { gap: 8px; margin-top: 12px; }
    .keypad button { height: 48px; font-size: 30px; }
    .keypad .k-del { font-size: 16px; }
    .action { font-size: 24px; padding: 10px; margin-top: 14px; }

    /* けっか がめん：ふりかえり を 2れつ、ボタン を よこ に ならべる */
    #finish .card { padding: 16px 20px; }
    .praise { font-size: 24px; margin: 4px 0 4px; }
    .score { font-size: 56px; margin: 0; line-height: 1.2; }
    .score small { font-size: 26px; }
    .time { font-size: 20px; }
    .review { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; margin-top: 14px; }
    .review li { font-size: 19px; padding: 7px 4px; }
    .review .fix { font-size: 15px; }
    .finish-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .finish-btns .big-btn { margin-top: 18px; font-size: 24px; }
    .buddy-name { font-size: 18px; }
    .cele-title { font-size: 40px; }
    .finish-meta { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; column-gap: 24px; }
    .xp-gain { font-size: 20px; }

    .badge-grid { grid-template-columns: repeat(4, 1fr); }
  }

  /* ひろい パソコン：はじめ の がめん は、ひだり に えらぶ ところ、みぎ に カレンダー */
  @media (min-width: 860px) {
    body.on-start .wrap { max-width: 1080px; }
    .start-layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; align-items: start; }
    .start-side { display: block; } /* みぎ に キャラクター と カレンダー */
    /* たて が せまい ときは キャラクター と カレンダー を すこし ちいさく */
    .buddy { margin: 4px 0 0; padding: 4px 12px 4px 4px; }
    .buddy-pic { width: 58px; height: 58px; }
    .calendar { margin-top: 8px; padding: 10px 12px 8px; --cell: 30px; }

    .parent-link { margin-top: 4px; }

    body.on-badges .wrap { max-width: 1080px; }
    body.on-badges h1 { margin: 4px 0 12px; }

<script>
(() => {
  const TOTAL = 10;
  const MAX_DIGITS = 4;
  const AUTO_NEXT_OK_MS = 1500; // せいかい の とき
  const AUTO_NEXT_NG_MS = 3000; // まちがい の とき（こたえ を みる じかん）

  let op = "+";
  let level = "1e";
  let problems = [];
  let index = 0;
  let input = "";
  let answered = false;
  let startTime = 0;
  let timerId = null;
  let autoNextId = null;
  let shownAt = 0; // いま の もんだい を だした じこく
  let sessionXp = 0; // この 10もん で もらった けいけんち

  const $ = (id) => document.getElementById(id);

  // ---- えらぶ ボタン ----
  function setupChoices(containerId, onPick) {
    const buttons = $(containerId).querySelectorAll(".choice");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        onPick(btn.dataset);
      });
    });
  }
  setupChoices("opChoices", (d) => { op = d.op; });
  setupChoices("levelChoices", (d) => { level = d.level; });

  // ---- もんだい を つくる ----
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  // じょうけん に あう もんだい が でる まで つくりなおす
  function pick(make, ok) {
    for (;;) { const v = make(); if (ok(v)) return v; }
  }
  const ones = (n) => n % 10;
  const tens = (n) => Math.floor(n / 10);

  // むずかしさ
  //   1e: 1けた やさしい   1h: 1けた むずかしい
  //   2e: 2けた やさしい   2h: 2けた むずかしい
  function makeProblem() {
    let a, b, ans;
    switch (op) {
      case "+":
        [a, b] = pick(
          () => level[0] === "1" ? [rand(1, 9), rand(1, 9)] : [rand(10, 99), rand(10, 99)],
          ([x, y]) => {
            const carry = ones(x) + ones(y) >= 10 || (level[0] === "1" && x + y >= 10);
            if (level === "1e") return x + y <= 9;            // くりあがり なし
            if (level === "1h") return x + y >= 10;           // くりあがり あり
            if (level === "2e") return !carry && x + y <= 99; // くりあがり なし
            return carry;                                     // くりあがり あり
          });
        ans = a + b;
        break;
      case "-":
        // こたえ が マイナス に ならない ように する
        [a, b] = pick(
          () => level === "1e" ? [rand(2, 9), rand(1, 8)]
              : level === "1h" ? [rand(11, 18), rand(2, 9)]
              : [rand(20, 99), rand(10, 98)],
          ([x, y]) => {
            if (x <= y) return false;
            if (level === "1e") return true;                  // 9 までの ひきざん
            if (level === "1h") return ones(x) < y;           // くりさがり あり
            if (level === "2e") return ones(x) >= ones(y);    // くりさがり なし
            return ones(x) < ones(y);                         // くりさがり あり
          });
        ans = a - b;
        break;
      case "×":
        [a, b] = pick(
          () => level[0] === "1" ? [rand(1, 9), rand(1, 9)] : [rand(11, 99), rand(2, 9)],
          ([x, y]) => {
            if (level === "1e") return x <= 5;                // 1〜5 の だん
            if (level === "1h") return x >= 6;                // 6〜9 の だん
            const easy = tens(x) * y < 10 && ones(x) * y < 10;
            return level === "2e" ? easy : !easy;             // くりあがり なし / あり
          });
        ans = a * b;
        break;
      case "÷":
        // かならず わりきれる もんだい
        [b, ans] = pick(
          () => level[0] === "1" ? [rand(1, 9), rand(1, 9)] : [rand(2, 9), rand(10, 49)],
          ([y, q]) => {
            if (level === "1e") return y <= 5;                // 1〜5 の だん の ぎゃく
            if (level === "1h") return y >= 6;                // 6〜9 の だん の ぎゃく
            if (y * q > 99) return false;                     // わられる かず は 2けた
            const easy = tens(q) * y < 10 && ones(q) * y < 10;
            return level === "2e" ? easy : !easy;             // 84÷4 の ような かんたん な もの / 72÷4 の ような もの
          });
        a = b * ans;
        break;
    }
    return { a, b, ans, text: `${a} ${op} ${b}` };
  }

  function makeProblems() {
    const list = [];
    const seen = new Set();
    let tries = 0;
    while (list.length < TOTAL) {
      const p = makeProblem();
      if (!seen.has(p.text) || tries++ > 200) {
        seen.add(p.text);
        list.push(p);
      }
    }
    return list;
  }

  // ---- きろく（ブラウザ に ほぞん して、とじても きえない）----
  const RECORD_KEY = "keisan-renshu-records";
  const MARU_COUNT = 10;     // この かず いじょう で ○
  const HANAMARU_COUNT = 20; // この かず いじょう で はなまる

  function loadRecords() {
    try {
      const data = JSON.parse(localStorage.getItem(RECORD_KEY));
      return data && typeof data === "object" && !Array.isArray(data) ? data : {};
    } catch (e) {
      return {};
    }
  }
  let records = loadRecords();

  const pad2 = (n) => String(n).padStart(2, "0");
  const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const countOf = (key) => Number(records[key]) || 0;

  // こたえあわせ を する たび に、その日 の かず を 1 ふやす
  function addRecord() {
    records = loadRecords(); // べつ の タブ で ふえた ぶん も いかす
    const key = dateKey(new Date());
    records[key] = countOf(key) + 1;
    try { localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (e) { /* ほぞん できなくても つづける */ }
  }

  // ---- 1もん ごと の きろく（おうちのかたへ の レポート で つかう）----
  // けいさん・むずかしさ・もんだい・せいかい か・かかった じかん を のこす
  const LOG_KEY = "keisan-renshu-log";
  const LOG_KEEP_DAYS = 100; // これ より ふるい きろく は けす
  const DAY_MS = 24 * 60 * 60 * 1000;

  function loadLog() {
    try {
      const data = JSON.parse(localStorage.getItem(LOG_KEY));
      return Array.isArray(data)
        ? data.filter((e) => e && typeof e.t === "number" && "+-×÷".includes(e.op) && typeof e.lv === "string")
        : [];
    } catch (e) {
      return [];
    }
  }

  function addLog(p, ms) {
    const now = Date.now();
    const log = loadLog().filter((e) => e.t >= now - LOG_KEEP_DAYS * DAY_MS);
    log.push({ t: now, op, lv: level, a: p.a, b: p.b, ok: p.correct ? 1 : 0, ms });
    try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) { /* ほぞん できなくても つづける */ }
  }

  // ---- カレンダー ----
  const MARU_SVG =
    '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="41" fill="none" stroke="#f03e3e" stroke-width="7"/></svg>';
  const HANAMARU_SVG = (() => {
    // まわり の はなびら
    const N = 10, R = 38, r = 12;
    const pt = (i) => {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      return `${(50 + R * Math.cos(a)).toFixed(1)} ${(50 + R * Math.sin(a)).toFixed(1)}`;
    };
    let petals = `M${pt(0)}`;
    for (let i = 1; i <= N; i++) petals += ` A${r} ${r} 0 0 1 ${pt(i)}`;
    // なか の ぐるぐる（まんなか の すうじ に かからない ように そと がわ だけ）
    let spiral = "";
    for (let i = 0; i <= 80; i++) {
      const t = i / 80;
      const a = -Math.PI / 2 + t * Math.PI * 2 * 1.75;
      const rr = 31 - t * 9;
      spiral += `${i ? " L" : "M"}${(50 + rr * Math.cos(a)).toFixed(1)} ${(50 + rr * Math.sin(a)).toFixed(1)}`;
    }
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#f03e3e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">' +
      `<path d="${petals}" fill="#fff0f6"/><path d="${spiral}" fill="none"/></g></svg>`;
  })();
  const markOf = (n) => n >= HANAMARU_COUNT ? HANAMARU_SVG : n >= MARU_COUNT ? MARU_SVG : "";

  let calYear, calMonth, calPicked = null;

  function resetCalendar() {
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    calPicked = null;
    renderCalendar();
  }

  function renderCalendar() {
    const todayKey = dateKey(new Date());
    $("calTitle").textContent = `${calYear}ねん ${calMonth + 1}がつ`;
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    let html = "";
    for (let i = 0; i < first; i++) html += "<div></div>";
    for (let d = 1; d <= days; d++) {
      const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
      const wd = (first + d - 1) % 7;
      const cls = ["cal-day",
        wd === 0 ? "sun" : wd === 6 ? "sat" : "",
        key === todayKey ? "today" : "",
        key > todayKey ? "future" : "",
        key === calPicked ? "picked" : ""].join(" ");
      html += `<div class="${cls}" data-date="${key}">` +
        `<span class="cal-mark">${markOf(countOf(key))}</span><span class="cal-num">${d}</span></div>`;
    }
    $("calDays").innerHTML = html;
    renderCalInfo();
  }

  function renderCalInfo() {
    const todayKey = dateKey(new Date());
    const key = calPicked || todayKey;
    const n = countOf(key);
    let text;
    if (key === todayKey) {
      text = n >= HANAMARU_COUNT ? `きょう は ${n}もん！ はなまる 🎉`
           : n >= MARU_COUNT ? `きょう は ${n}もん！ あと ${HANAMARU_COUNT - n}もん で はなまる`
           : `きょう は ${n}もん。あと ${MARU_COUNT - n}もん で ○`;
    } else {
      const [, m, d] = key.split("-").map(Number);
      text = key > todayKey ? `${m}がつ ${d}にち は まだ だよ`
           : `${m}がつ ${d}にち は ${n}もん` + (n >= HANAMARU_COUNT ? " はなまる" : n >= MARU_COUNT ? " ○" : "");
    }
    $("calInfo").textContent = text;
  }

  $("calLegend").innerHTML =
    `<span>${MARU_SVG} ${MARU_COUNT}もん いじょう</span><span>${HANAMARU_SVG} ${HANAMARU_COUNT}もん いじょう</span>`;
  $("calPrev").addEventListener("click", () => {
    if (--calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  $("calNext").addEventListener("click", () => {
    if (++calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
  $("calDays").addEventListener("click", (e) => {
    const day = e.target.closest(".cal-day");
    if (!day) return;
    calPicked = calPicked === day.dataset.date ? null : day.dataset.date;
    renderCalendar();
  });
  resetCalendar();

  // ---- おうちのかたへ（がくしゅう レポート）----
  const OPS = [
    { op: "+", name: "たし算", color: "var(--plus)" },
    { op: "-", name: "ひき算", color: "var(--minus)" },
    { op: "×", name: "かけ算", color: "var(--times)" },
    { op: "÷", name: "わり算", color: "var(--divide)" },
  ];
  const AWAY_MS = 3 * 60 * 1000; // これ より ながく かかった もの は、せき を はなれた と みなして へいきん から のぞく
  const WEAK_DAYS = 30;          // よく まちがえる もんだい を しらべる きかん

  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const pct = (r) => r == null ? "—" : `${Math.round(r * 100)}%`;
  const secs = (ms) => ms == null ? "—" : `${(ms / 1000).toFixed(1)}秒`;

  // きかん [from, to) の もんだいすう と べんきょう した ひ の かず（カレンダー の きろく から）
  function countRange(from, to) {
    let total = 0, days = 0;
    for (let d = from; d < to; d = addDays(d, 1)) {
      const n = countOf(dateKey(d));
      total += n;
      if (n > 0) days++;
    }
    return { total, days };
  }

  // れんぞく で べんきょう した ひ の かず
  // きょう まだ やって いなくても、きのう まで つづいて いれば れんぞく と する
  function currentStreak() {
    const today = startOfDay(new Date());
    let streak = 0;
    for (let d = countOf(dateKey(today)) > 0 ? today : addDays(today, -1); countOf(dateKey(d)) > 0; d = addDays(d, -1)) streak++;
    return streak;
  }

  function summarize(list) {
    const ok = list.filter((e) => e.ok).length;
    const timed = list.filter((e) => e.ms > 0 && e.ms <= AWAY_MS);
    return {
      n: list.length,
      rate: list.length ? ok / list.length : null,
      avgMs: timed.length ? timed.reduce((s, e) => s + e.ms, 0) / timed.length : null,
    };
  }

  // まちがい の なかま わけ（「7の段」「くり上がり」など）と、おうち で できる ひとこと
  function weakTag(e) {
    const two = e.lv[0] === "2";
    const keta = two ? "2けた" : "1けた";
    switch (e.op) {
      case "+": {
        const c = ones(e.a) + ones(e.b) >= 10;
        return { key: `+${keta}${c}`, label: `たし算 くり上がり${c ? "あり" : "なし"}（${keta}）`,
          tip: c ? "「10のまとまり」を作る考え方（7+8 → 7+3+5）を一緒に確かめてみましょう。"
                 : "位をそろえて、一の位から順に計算する習慣をつけましょう。" };
      }
      case "-": {
        const c = ones(e.a) < ones(e.b);
        return { key: `-${keta}${c}`, label: `ひき算 くり下がり${c ? "あり" : "なし"}（${keta}）`,
          tip: c ? "「10からひく」考え方（13−8 → 10−8+3）を一緒に確かめてみましょう。"
                 : "位をそろえて、一の位から順に計算する習慣をつけましょう。" };
      }
      case "×": {
        if (!two) return { key: `×${e.a}`, label: `かけ算 ${e.a}の段`,
          tip: `${e.a}の段を声に出して唱える練習がおすすめです。` };
        const c = !(tens(e.a) * e.b < 10 && ones(e.a) * e.b < 10);
        return { key: `×2${c}`, label: `かけ算 2けた×1けた（くり上がり${c ? "あり" : "なし"}）`,
          tip: c ? "くり上がった数を小さく書き留めてから、十の位を計算する練習をしてみましょう。"
                 : "位ごとに分けて計算する考え方（34×2 → 30×2 と 4×2）を確かめましょう。" };
      }
      default: {
        if (!two) return { key: `÷${e.b}`, label: `わり算 ÷${e.b}（${e.b}の段の逆）`,
          tip: `わり算は九九の逆です。${e.b}の段の九九を復習すると解きやすくなります。` };
        const q = e.a / e.b;
        const c = !(tens(q) * e.b < 10 && ones(q) * e.b < 10);
        return { key: `÷2${c}`, label: `わり算 2けた÷1けた（${c ? "十の位であまりが出る" : "各位がわりきれる"}）`,
          tip: c ? "十の位のあまりを一の位に下ろす流れを、紙に書いて確かめましょう。"
                 : "十の位、一の位の順に分けてわる考え方（68÷2 → 60÷2 と 8÷2）を確かめましょう。" };
      }
    }
  }

  // まちがい の おおい じゅん
  function weakRanking(list) {
    const groups = new Map();
    list.forEach((e) => {
      const tag = weakTag(e);
      const g = groups.get(tag.key) || { ...tag, n: 0, miss: 0, probs: {} };
      g.n++;
      if (!e.ok) {
        g.miss++;
        const text = `${e.a} ${e.op} ${e.b}`;
        g.probs[text] = (g.probs[text] || 0) + 1;
      }
      groups.set(tag.key, g);
    });
    return [...groups.values()]
      .filter((g) => g.miss > 0)
      .sort((x, y) => y.miss - x.miss || y.miss / y.n - x.miss / x.n)
      .map((g) => {
        const [text, times] = Object.entries(g.probs).sort((x, y) => y[1] - x[1])[0];
        return { ...g, example: times > 1 ? `${text}（${times}回）` : text };
      });
  }

  function diffHtml(cur, prev) {
    if (cur == null || prev == null) return '<span class="flat">—</span>';
    const d = Math.round(cur * 100) - Math.round(prev * 100);
    return d > 0 ? `<span class="up">▲${d}</span>` : d < 0 ? `<span class="down">▼${-d}</span>` : '<span class="flat">±0</span>';
  }

  function renderReport() {
    records = loadRecords();
    const log = loadLog();
    const today = startOfDay(new Date());
    const tomorrow = addDays(today, 1);
    const weekStart = addDays(today, -((today.getDay() + 6) % 7)); // げつようび はじまり
    const lastWeekStart = addDays(weekStart, -7);
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const between = (from, to) => log.filter((e) => e.t >= from.getTime() && e.t < to.getTime());

    // とりくみ（もんだいすう・ひにち は カレンダー と おなじ きろく から）
    const week = countRange(weekStart, tomorrow);
    const lastWeek = countRange(lastWeekStart, weekStart);
    const month = countRange(monthStart, tomorrow);
    const studiedToday = countOf(dateKey(today)) > 0;
    const streak = currentStreak();

    const thisWeekLog = between(weekStart, tomorrow);
    const lastWeekLog = between(lastWeekStart, weekStart);
    const wAll = summarize(thisWeekLog);
    const lwAll = summarize(lastWeekLog);

    const tile = (label, val, unit, sub = "") =>
      `<div class="rp-stat"><div class="label">${label}</div>` +
      `<div class="val">${val}${val === "—" ? "" : `<small>${unit}</small>`}</div><div class="sub">${sub}</div></div>`;
    $("rpSummary").innerHTML =
      tile("今週 解いた問題", week.total, "問", `先週 ${lastWeek.total}問`) +
      tile("今月 解いた問題", month.total, "問") +
      tile("今週 勉強した日", week.days, "日", `先週 ${lastWeek.days}日`) +
      tile("今月 勉強した日", month.days, "日") +
      tile("連続日数", streak, "日", streak && !studiedToday ? "今日はまだ" : "") +
      tile("今週 1問あたり平均", wAll.avgMs == null ? "—" : (wAll.avgMs / 1000).toFixed(1), "秒", `先週 ${secs(lwAll.avgMs)}`);

    // けいさん ごと の せいとうりつ
    const opRows = OPS.map((o) => ({
      ...o,
      cur: summarize(thisWeekLog.filter((e) => e.op === o.op)),
      prev: summarize(lastWeekLog.filter((e) => e.op === o.op)),
    }));
    $("rpOps").innerHTML =
      '<div class="rp-op rp-op-head"><span></span><span>今週</span><span>先週</span><span>先週比</span></div>' +
      opRows.map((r) => `
        <div class="rp-op">
          <span class="rp-op-name"><i style="background:${r.color}"></i>${r.name}</span>
          <span class="rp-op-bar"><b>${pct(r.cur.rate)}</b><span class="bar"><span style="width:${r.cur.rate == null ? 0 : Math.round(r.cur.rate * 100)}%;background:${r.color}"></span></span></span>
          <span>${pct(r.prev.rate)}</span>
          <span>${diffHtml(r.cur.rate, r.prev.rate)}</span>
          <span class="rp-op-sub">今週 ${r.cur.n}問 ・ 1問 平均 ${secs(r.cur.avgMs)}</span>
        </div>`).join("");

    // よく まちがえる もんだい
    const weakLog = between(addDays(today, -(WEAK_DAYS - 1)), tomorrow);
    const weak = weakRanking(weakLog);
    $("rpWeak").innerHTML = weak.length
      ? weak.slice(0, 5).map((g, i) => `
        <li><span class="rank">${i + 1}</span><div><b>${g.label}</b>
          <div class="rp-weak-sub">まちがい ${g.miss}回 ／ ${g.n}問中（正答率 ${pct(1 - g.miss / g.n)}）・ 例：${g.example}</div></div></li>`).join("")
      : `<li class="rp-empty">${weakLog.length ? `直近${WEAK_DAYS}日で間違えた問題はありません。すばらしい！` : "まだ記録がありません。"}</li>`;

    // ひとこと アドバイス：「よいところ」と「次のステップ」を 1つ ずつ
    const good = [], next = [];
    const compared = opRows
      .filter((r) => r.cur.n >= 5 && r.prev.n >= 5)
      .map((r) => ({ ...r, d: Math.round(r.cur.rate * 100) - Math.round(r.prev.rate * 100) }));
    const up = compared.filter((r) => r.d >= 10).sort((x, y) => y.d - x.d)[0];
    const down = compared.filter((r) => r.d <= -10).sort((x, y) => x.d - y.d)[0];
    const top = weak[0];

    if (up) good.push(`${up.name}の正答率が先週より${up.d}ポイント上がりました。できるようになったことを、ぜひほめてあげてください。`);
    if (wAll.n >= 20 && wAll.rate >= 0.9) good.push(`今週の正答率は${pct(wAll.rate)}ととても安定しています。「むずかしさ」を一段上げてみてもよい時期です。`);
    if (streak >= 3) good.push(`${streak}日連続で取り組めています。続けていること自体を認めてあげると、やる気が長続きします。`);
    if (week.total > 0) good.push(`今週は${week.total}問に取り組みました。正解したときに一緒に喜んであげましょう。`);

    if (top && top.miss >= 3 && top.miss / top.n >= 0.3) next.push(`「${top.label}」でつまずきが多いようです。${top.tip}`);
    if (down) next.push(`${down.name}の正答率が先週より${-down.d}ポイント下がっています。少しやさしい「むずかしさ」で自信を取り戻すのも効果的です。`);
    if (wAll.n >= 10 && wAll.rate < 0.6) next.push(`今週の正答率は${pct(wAll.rate)}です。「むずかしさ」を一段下げて、できた経験を増やしてあげましょう。`);
    if (week.total === 0) next.push(`今週はまだ取り組んでいません。1日${MARU_COUNT}問（カレンダーの○）を目標に、毎日の習慣にしてみましょう。`);
    if (streak > 0 && !studiedToday) next.push(`今日取り組むと${streak + 1}日連続になります。声をかけてみてください。`);
    next.push("この調子で、毎日少しずつ続けていきましょう。");

    $("rpAdvice").innerHTML =
      (good.length ? `<p class="rp-advice good"><span>よいところ</span>${good[0]}</p>` : "") +
      `<p class="rp-advice next"><span>次のステップ</span>${next[0]}</p>`;

    const first = log.length ? new Date(Math.min(...log.map((e) => e.t))) : null;
    $("rpFoot").innerHTML =
      (first
        ? `※ 正答率・時間・よく間違える問題は、${first.getMonth() + 1}月${first.getDate()}日からの記録で集計しています（直近${LOG_KEEP_DAYS}日分を保存）。`
        : "※ 正答率・時間・よく間違える問題は、これから解いた問題で集計されます。") +
      `<br>※ 1問に${AWAY_MS / 60000}分以上かかったものは、席を離れていたとみなして平均時間から除いています。` +
      "<br>※ 記録はこのブラウザだけに保存されています。";
  }

  // ---- そだつ なかま（けいけんち で せいちょう する）----
  const GROWTH_KEY = "keisan-renshu-growth";
  const XP_PER_CORRECT = 10; // 1もん せいかい で もらえる けいけんち
  const PERFECT_BONUS = 50;  // ぜんもん せいかい の ボーナス
  // この けいけんち に なる と レベルアップ して、みため が かわる
  const STAGES = [
    { xp: 0,    name: "たまご" },
    { xp: 100,  name: "ゆれる たまご" },
    { xp: 400,  name: "ひよこ" },
    { xp: 1000, name: "げんきな ひよこ" },
    { xp: 2000, name: "にわとり" },
  ];
  const stageOf = (xp) => STAGES.reduce((s, st, i) => (xp >= st.xp ? i : s), 0);

  function loadGrowth() {
    try {
      const d = JSON.parse(localStorage.getItem(GROWTH_KEY));
      if (d && typeof d === "object") {
        return {
          xp: Number(d.xp) || 0,
          perfect: Number(d.perfect) || 0,              // ぜんもん せいかい した かいすう
          ops: Array.isArray(d.ops) ? d.ops : [],       // せいかい した こと が ある けいさん
          kuku: Array.isArray(d.kuku) ? d.kuku : [],    // せいかい した くく（"7 × 8" など）
          badges: d.badges && typeof d.badges === "object" ? d.badges : {}, // もらった バッジ と その ひ
        };
      }
    } catch (e) { /* よめなければ さいしょ から */ }
    return { xp: 0, perfect: 0, ops: [], kuku: [], badges: {} };
  }
  function saveGrowth(g) {
    try { localStorage.setItem(GROWTH_KEY, JSON.stringify(g)); } catch (e) { /* ほぞん できなくても つづける */ }
  }

  // キャラクター の え（5だんかい）

  }

  // ---- バッジ ----
  // goal: [いま の かず, めあて] を かえす（バッジ いちらん で「あと どれくらい」を だす）
  // check: その かい の 10もん の けっか で きまる もの

    { id: "streak14",   icon: "👑", name: "14にち れんぞく",   desc: "14にち つづけて とく",        goal: (s) => [s.streak, 14] },
    { id: "perfect1",   icon: "💯", name: "はじめての ぜんもん せいかい", desc: `${TOTAL}もん ぜんぶ せいかい`, goal: (s) => [s.perfect, 1] },
    { id: "perfect10",  icon: "🎯", name: "ぜんもん せいかい 10かい", desc: "ぜんもん せいかい を 10かい", goal: (s) => [s.perfect, 10] },
    { id: "hanamaru1",  icon: "🌸", name: "はじめての はなまる", desc: `1にち に ${HANAMARU_COUNT}もん とく`, goal: (s) => [s.hanamaru, 1] },

    { id: "allops",     icon: "🧮", name: "4つの けいさん",    desc: "＋ − × ÷ ぜんぶ で せいかい", goal: (s) => [s.ops, 4] },
    { id: "kuku",       icon: "🎓", name: "くく マスター",     desc: "くく の 81もん を ぜんぶ せいかい", goal: (s) => [s.kuku, 81] },
    { id: "speed",      icon: "⚡", name: "スピードスター",    desc: `${TOTAL}もん を 1ぷん いない で ぜんもん せいかい`,
      check: (s) => s.session && s.session.perfect && s.session.ms <= 60 * 1000 },
    { id: "hard",       icon: "💪", name: "チャレンジャー",    desc: "2けた むずかしい で ぜんもん せいかい",
      check: (s) => s.session && s.session.perfect && s.session.level === "2h" },
    { id: "maxlevel",   icon: "🐔", name: "そだて めいじん",   desc: `${STAGES[STAGES.length - 1].name} に そだてる`, goal: (s) => [s.stage, STAGES.length] },
  ];

  function badgeStats(g, session) {
    records = loadRecords();
    const counts = Object.values(records).map((n) => Number(n) || 0);
    return {
      total: counts.reduce((a, n) => a + n, 0),
      hanamaru: counts.filter((n) => n >= HANAMARU_COUNT).length,
      streak: currentStreak(),
      perfect: g.perfect,
      ops: g.ops.length,
      kuku: g.kuku.length,
      stage: stageOf(g.xp) + 1,
      session,
    };
  }
  const isEarned = (b, s) => b.goal ? b.goal(s)[0] >= b.goal(s)[1] : !!b.check(s);
  const medal = (b, got) => `<div class="medal${got ? "" : " locked"}"><span>${b.icon}</span></div>`;

  // おいわい は ためて おいて、けっか がめん か はじめ の がめん で じゅんばん に だす
  const celebrations = [];

  // けいけんち など を かえて、レベルアップ と あたらしい バッジ を しらべる
  function updateGrowth(change, session = null) {
    const g = loadGrowth(); // べつ の タブ で ふえた ぶん も いかす
    const before = stageOf(g.xp);
    change(g);
    const after = stageOf(g.xp);
    if (after > before) celebrations.push({ type: "level", stage: after });

    const s = badgeStats(g, session);
    const got = BADGES.filter((b) => !g.badges[b.id] && isEarned(b, s)).map((b) => b.id);
    got.forEach((id) => { g.badges[id] = dateKey(new Date()); });
    if (got.length) {
      // いっしょ に もらった バッジ は 1かい の おいわい に まとめる
      const last = celebrations[celebrations.length - 1];
      if (last && last.type === "badges") last.ids.push(...got);
      else celebrations.push({ type: "badges", ids: got });
    }
    saveGrowth(g);
  }

  function renderGrowth() {
    const g = loadGrowth();
    const st = stageOf(g.xp);
    const next = STAGES[st + 1];
    $("buddyPic").innerHTML = buddySvg(st);
    $("buddyLv").textContent = `Lv.${st + 1}`;
    $("buddyName").textContent = STAGES[st].name;
    $("xpBar").style.width = next ? `${((g.xp - STAGES[st].xp) / (next.xp - STAGES[st].xp)) * 100}%` : "100%";
    $("buddyNext").textContent = next ? `あと ${next.xp - g.xp} で レベルアップ` : `けいけんち ${g.xp}・さいこう レベル！`;
    $("badgeCount").textContent = `${BADGES.filter((b) => g.badges[b.id]).length}/${BADGES.length}`;
  }

  function renderBadges() {
    const g = loadGrowth();
    const s = badgeStats(g, null);
    $("badgeSummary").textContent = `${BADGES.filter((b) => g.badges[b.id]).length} / ${BADGES.length} こ ゲット！`;
    $("badgeGrid").innerHTML = BADGES.map((b) => {
      const when = g.badges[b.id];
      let sub = "";
      if (when) {
        const [, m, d] = when.split("-").map(Number);
        sub = `${m}/${d} ゲット`;
      } else if (b.goal) {
        const [cur, goal] = b.goal(s);
        sub = `${Math.min(cur, goal)} / ${goal}`;
      }
      return `<div class="badge-card${when ? "" : " locked"}">${medal(b, !!when)}` +
        `<div class="badge-name">${b.name}</div><div class="badge-desc">${b.desc}</div><div class="badge-prog">${sub}</div></div>`;
    }).join("");
  }

  // ---- おいわい の がめん ----
  function confetti() {
    const colors = ["#ff7b7b", "#4dabf7", "#51cf66", "#fcc419", "#ff922b", "#9775fa"];
    $("confetti").innerHTML = Array.from({ length: 40 }, (_, i) =>
      `<span style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};` +
      `animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * 0.6}s"></span>`).join("");
  }

  function nextCelebration() {
    const c = celebrations.shift();
    if (!c) {
      $("celebrate").hidden = true;
      if ($("start").classList.contains("active")) renderGrowth();
      return;
    }
    if (c.type === "level") {
      $("celeTitle").textContent = "レベルアップ！";
      $("celeBody").innerHTML = `<div class="cele-pic">${buddySvg(c.stage)}</div>` +
        `<div class="cele-text">Lv.${c.stage + 1}「${STAGES[c.stage].name}」に なったよ！</div>`;
      playFanfare();
    } else {
      const list = c.ids.map((id) => BADGES.find((b) => b.id === id));
      $("celeTitle").textContent = "バッジ ゲット！";
      $("celeBody").innerHTML = `<div class="cele-badges${list.length === 1 ? " one" : ""}">` +
        list.map((b) => `<div class="cele-badge">${medal(b, true)}<div class="cele-text">${b.name}</div><div class="badge-desc">${b.desc}</div></div>`).join("") +
        "</div>";
      playKirarin();
    }
    confetti();
    $("celebrate").hidden = false;
    const box = $("celeBox");
    box.classList.remove("pop");
    void box.offsetWidth; // アニメーション を もういちど うごかす
    box.classList.add("pop");
    $("celeOk").focus();
  }
  function celebrate() {
    if ($("celebrate").hidden) nextCelebration();
  }

  // ---- がめん きりかえ ----
  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
    document.body.classList.toggle("on-start", id === "start");
    document.body.classList.toggle("on-badges", id === "badges");
    if (id === "start") { resetCalendar(); renderGrowth(); }
    if (id === "badges") renderBadges();
    if (id === "parent") renderReport();
    window.scrollTo(0, 0);
    if (id === "start" || id === "finish") celebrate();
  }

  // ---- こうかおん（おんせい ファイル は つかわず ブラウザ で つくる）----
  let audioCtx = null;
  // スマホ は さいしょ に がめん を さわった とき で ないと おと が でない ので、そこで じゅんび する
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state !== "running") {
        // iPhone で たしか に おと が でる ように、むおん を いっしゅん ならして から さいかい する
        const src = audioCtx.createBufferSource();
        src.buffer = audioCtx.createBuffer(1, 1, 22050);
        src.connect(audioCtx.destination);
        src.start(0);
        audioCtx.resume();
      }
    } catch (e) { /* おと が だせなくても つづける */ }
  }
  // iPhone は ゆび を はなした とき か タップ した とき で ないと おと の じゅんび が できない ので、そこ で じゅんび する（タッチ した しゅんかん では だめ）
  ["touchend", "click", "keydown"].forEach((type) => document.addEventListener(type, unlockAudio, true));

  // がめん を けしたり ほか の アプリ に いったり して とまって いたら、ならす まえ に さいかい する
  function readyAudio() {
    if (audioCtx && audioCtx.state !== "running") audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function tone(freq, start, dur, type = "sine", vol = 0.35) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  }
  // せいかい の「ピンポン」（たかい おと → ひくい おと）
  function playPinpon() {
    if (!readyAudio()) return;
    const t = audioCtx.currentTime;
    tone(1319, t, 0.35);        // ピン（ミ）
    tone(1047, t + 0.18, 0.6);  // ポン（ド）
  }
  // まちがい の「ブブー」（ひくい ブザー の おと）
  function playBubu() {
    if (!readyAudio()) return;
    const t = audioCtx.currentTime;
    tone(150, t, 0.16, "square", 0.12);        // ブ
    tone(150, t + 0.22, 0.6, "square", 0.12);  // ブー
  }
  // レベルアップ の「パッパッパッパー」（ド ミ ソ ド → さいご は わおん）
  function playFanfare() {
    if (!readyAudio()) return;
    const t = audioCtx.currentTime;
    [523, 659, 784].forEach((f, i) => tone(f, t + i * 0.13, 0.22, "triangle", 0.3));
    [1047, 1319, 1568].forEach((f) => tone(f, t + 0.42, 0.9, "triangle", 0.22));
  }
  // バッジ ゲット の「キラリーン」
  function playKirarin() {
    if (!readyAudio()) return;
    const t = audioCtx.currentTime;
    [1568, 2093, 2637, 3136].forEach((f, i) => tone(f, t + i * 0.07, 0.5, "sine", 0.18));
  }

  // ---- タイマー ----
  function formatTime(ms) {
    const sec = Math.floor(ms / 1000);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m > 0 ? `${m}ぷん ${s}びょう` : `${s}びょう`;
  }
  function startTimer() {
    startTime = Date.now();
    $("timer").textContent = "⏱ 0びょう";
    clearInterval(timerId);
    timerId = setInterval(() => {
      $("timer").textContent = "⏱ " + formatTime(Date.now() - startTime);
    }, 250);
  }
  function stopTimer() {
    clearInterval(timerId);
    clearTimeout(autoNextId);
    return Date.now() - startTime;
  }

  // ---- ゲーム の ながれ ----
  function startGame() {
    problems = makeProblems();
    index = 0;
    sessionXp = 0;
    show("quiz");
    showProblem();
    startTimer();
  }

  function showProblem() {
    const p = problems[index];
    input = "";
    answered = false;
    $("qNum").textContent = `${index + 1}もんめ / ${TOTAL}`;
    $("bar").style.width = `${(index / TOTAL) * 100}%`;
    $("question").textContent = `${p.text} ＝`;
    $("result").textContent = "";
    $("result").className = "result";
    $("checkBtn").textContent = "こたえあわせ";
    $("checkBtn").className = "action";
    setKeypadEnabled(true);
    renderInput();
    shownAt = Date.now();
  }

  function renderInput() {
    const box = $("answerBox");
    if (input === "") {
      box.textContent = "？";
      box.classList.add("empty");
    } else {
      box.textContent = input;
      box.classList.remove("empty");
    }
    $("checkBtn").disabled = !answered && input === "";
  }

  function setKeypadEnabled(on) {
    $("keypad").querySelectorAll("button").forEach((b) => (b.disabled = !on));
  }

  function pressKey(key) {
    if (answered) return;
    if (key === "back") input = input.slice(0, -1);
    else if (key === "clear") input = "";
    else if (input.length < MAX_DIGITS) input = input === "0" ? key : input + key;
    renderInput();
  }

  function check() {
    if (answered || input === "") return;
    const p = problems[index];
    p.user = Number(input);
    p.correct = p.user === p.ans;
    answered = true;
    addRecord();
    addLog(p, Date.now() - shownAt);
    if (p.correct) sessionXp += XP_PER_CORRECT;
    updateGrowth((g) => {
      if (!p.correct) return; // まちがい でも もんだいすう の バッジ は しらべる
      g.xp += XP_PER_CORRECT;
      if (!g.ops.includes(op)) g.ops.push(op);
      if (op === "×" && level[0] === "1" && !g.kuku.includes(p.text)) g.kuku.push(p.text);
    });
    setKeypadEnabled(false);

    const r = $("result");
    if (p.correct) {
      r.innerHTML = "⭕ せいかい！";
      r.className = "result ok pop";
      playPinpon();
    } else {
      r.innerHTML = `❌ ざんねん…<small>こたえ は <b>${p.ans}</b></small>`;
      r.className = "result ng pop";
      playBubu();
    }
    $("bar").style.width = `${((index + 1) / TOTAL) * 100}%`;
    // せいかい は 1.5びょう、まちがい は 3びょう で じどう で つぎ へ すすむ
    const btn = $("checkBtn");
    btn.textContent = index + 1 < TOTAL ? "つぎ に すすむよ…" : "けっか を だすよ…";
    btn.className = "action next";
    btn.disabled = true;
    autoNextId = setTimeout(next, p.correct ? AUTO_NEXT_OK_MS : AUTO_NEXT_NG_MS);
  }

  function next() {
    index++;
    if (index < TOTAL) showProblem();
    else finish();
  }

  function finish() {
    const elapsed = stopTimer();
    const score = problems.filter((p) => p.correct).length;
    $("score").innerHTML = `${score}<small> / ${TOTAL} もん</small>`;
    $("timeResult").innerHTML = `かかった じかん：<span class="nowrap">${formatTime(elapsed)}</span>`;

    const perfect = score === TOTAL;
    if (perfect) sessionXp += PERFECT_BONUS;
    updateGrowth((g) => {
      if (!perfect) return;
      g.xp += PERFECT_BONUS;
      g.perfect++;
    }, { perfect, ms: elapsed, level });
    $("xpGain").innerHTML = `⭐ けいけんち +${sessionXp}` + (perfect ? `<small>（ぜんもん せいかい ボーナス +${PERFECT_BONUS}）</small>` : "");
    $("praise").textContent =
      score === TOTAL ? "💯 ぜんもん せいかい！すごい！" :
      score >= 8 ? "🌟 よく できました！" :
      score >= 5 ? "👍 がんばったね！" :
                   "💪 つぎ も がんばろう！";

    $("review").innerHTML = problems.map((p) => `
      <li>
        <span>${p.text} ＝ ${p.user}</span>
        ${p.correct
          ? '<span class="ok">⭕</span>'
          : `<span class="ng">❌ <span class="fix">こたえ ${p.ans}</span></span>`}
      </li>`).join("");
    show("finish");
  }

  // ---- イベント ----
  $("startBtn").addEventListener("click", startGame);
  $("retryBtn").addEventListener("click", startGame);
  $("homeBtn").addEventListener("click", () => show("start"));
  $("parentBtn").addEventListener("click", () => show("parent"));
  $("parentBack").addEventListener("click", () => show("start"));
  $("badgeBtn").addEventListener("click", () => show("badges"));
  $("badgesBack").addEventListener("click", () => show("start"));
  $("celeOk").addEventListener("click", nextCelebration);
  // キャラクター を さわる と ぴょん と はねる
  $("buddyPic").addEventListener("click", () => {
    const pic = $("buddyPic");
    pic.classList.remove("jump");
    void pic.offsetWidth;
    pic.classList.add("jump");
  });
  $("buddyPic").addEventListener("animationend", () => $("buddyPic").classList.remove("jump"));
  $("quitBtn").addEventListener("click", () => {
    if (confirm("とちゅう で やめる？")) { stopTimer(); show("start"); }
  });
  $("checkBtn").addEventListener("click", check);
  // すうじ ボタン は「おした しゅんかん」に はんのう する。
  // ボタン と ボタン の すきま を おした とき は、いちばん ちかい ボタン と して あつかう。
  function nearestKey(x, y) {
    let best = null, bestDist = Infinity;
    $("keypad").querySelectorAll("button").forEach((b) => {
      const r = b.getBoundingClientRect();
      const dx = Math.max(r.left - x, 0, x - r.right);
      const dy = Math.max(r.top - y, 0, y - r.bottom);
      const d = dx * dx + dy * dy;
      if (d < bestDist) { bestDist = d; best = b; }
    });
    return best;
  }
  function flash(btn) {
    btn.classList.add("pressed");
    setTimeout(() => btn.classList.remove("pressed"), 120);
  }
  $("keypad").addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); // もじ の せんたく や ダブルタップ で の かくだい を ふせぐ
    const btn = nearestKey(e.clientX, e.clientY);
    if (!btn || btn.disabled) return;
    flash(btn);
    pressKey(btn.dataset.key);
  });
  // Tab キー で えらんで Enter / スペース で おした とき
  $("keypad").addEventListener("click", (e) => {
    if (e.detail !== 0) return; // マウス・タッチ は pointerdown で しょり ずみ
    const btn = e.target.closest("button");
    if (btn && !btn.disabled) pressKey(btn.dataset.key);
  });

  // パソコン の キーボード でも つかえる
  document.addEventListener("keydown", (e) => {
    if (!$("quiz").classList.contains("active")) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); pressKey("back"); }
    else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.closest("#keypad")) return; // Tab で えらんだ すうじ ボタン を おす
      e.preventDefault(); check();
    }
  });

  // ひらいた とき：これまで の きろく で もらえる バッジ が あれば ここ で わたす
  updateGrowth(() => {});
  renderGrowth();
  celebrate();
})();
</script>
</body>
</html>
